name: Build and push the Web app to S3 & CloudFront

on :
  push:
    branches: 
      - develop
jobs:
  build:
    name: Build master branch adn deploy it to dev env
    runs-on: ubuntu-latest

    strategy:
      matrix: 
        node-version: [20]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        registry-url: 'https://registry.npmjs.org'
    - name: Npm Install
      run: |
        npm install
    - name: Code Build
      run: |
        npm run build
      env:
        CI: false
        REACT_APP_CRM_BACKEND_URL: https://api.acolead.com/crm-backend/api
        REACT_APP_PAYLOAD_API_URL: https://206.189.91.184.sslip.io/api
    - name: Deploy to Production
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --delete
      env:
        AWS_S3_BUCKET: coalitionafy.com
        AWS_ACCESS_KEY_ID: ${{ secrets.COL_DEV_AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.COL_DEV_AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ap-south-1
        SOURCE_DIR: "build"
    - name: Invalidate Cloudfront Cache
      uses: awact/cloudfront-action@master
      env:
        AWS_REGION: 'ap-south-1'
        AWS_ACCESS_KEY_ID: ${{ secrets.COL_DEV_AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.COL_DEV_AWS_SECRET_ACCESS_KEY }}
        DISTRIBUTION_ID: E3E661K3JME83O
